{{- if and .IsPage (in (slice "posts" "weekly") .Section) -}}
{{- if partial "twikoo-visitors-enabled.html" . -}}
<p class="sakura-post-header-visitors">
  <iconify-icon icon="mdi:eye-outline" class="sakura-post-visitors__icon" aria-hidden="true"></iconify-icon>
  <span class="sakura-post-visitors__label">访问量</span>
  <span id="twikoo_visitors">0</span>
</p>
{{- if eq .Params.comment false -}}
<div id="twikoo-visitor-mount" data-comment-path="{{ .Params.comment_path | default .RelPermalink }}" class="sakura-twikoo-visitor-mount" hidden></div>
{{- end -}}
{{- else if and site.Params.statistics.enable site.Params.statistics.articleEnable -}}
<p class="sakura-post-header-busuanzi">
  <span>访客数：<span id="busuanzi_page_uv" data-statistic>—</span></span>
  <span class="sakura-post-header-busuanzi__sep">|</span>
  <span>阅读量：<span id="busuanzi_page_pv" data-statistic>—</span></span>
</p>
{{- end -}}
{{- end -}}
