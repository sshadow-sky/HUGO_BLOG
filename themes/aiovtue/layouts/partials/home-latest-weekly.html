{{- with .Site.GetPage "/weekly" -}}
<section id="home-latest-weekly" class="home-latest-weekly sakura-weekly-page" aria-labelledby="home-weekly-title">
  <div class="home-latest-weekly__heading">
    <h2 id="home-weekly-title">最新周报</h2>
    <a href="{{ .RelPermalink }}">全部周报 <span aria-hidden="true">↗</span></a>
  </div>
  {{- with first 1 .RegularPagesRecursive.ByDate.Reverse -}}
    <div id="weekly-post-list" class="weekly-post-list">
      {{- range . -}}{{- partial "weekly-card-featured.html" (dict "Page" . "Site" .Site "Index" 0) -}}{{- end -}}
    </div>
  {{- else -}}
    <p class="weekly-empty">第一期，正在酝酿。<a href="{{ .RelPermalink }}">前往周报</a></p>
  {{- end -}}
</section>
{{- end -}}
